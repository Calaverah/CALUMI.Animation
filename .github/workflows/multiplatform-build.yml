name: Multi-Platform Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            preset: linux-release
          - os: ubuntu-latest
            preset: linux-debug
          - os: macos-latest
            preset: mac-release
          - os: macos-latest
            preset: mac-debug
          - os: windows-latest
            preset: win-release
          - os: windows-latest
            preset: win-debug

    defaults:
      run:
        working-directory: ./CALUMI.Animation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
