name: Multi-Platform Build
on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        config: [debug, release]
        include:
          - os: ubuntu-latest
            preset-prefix: "linux"
            arch: x64
          - os: windows-latest
            preset-prefix: "win"
            arch: x64
          - os: macos-latest
            preset-prefix: "mac"
            arch: arm64
          - os: macos-15-intel
            preset-prefix: "mac"
            arch: x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ninja (Optional)
        if: runner.os != 'Windows'
        run: sudo apt-get install ninja-build || brew install ninja

      - name: Setup MSVC (Windows Only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      #- name: Setup GCC 14
      #  if: runner.os == 'Linux'
      #  uses: egor-tensin/setup-gcc@v1
      #  with:
      #    version: 14
      #    platform: x64

      - name: Configure Library
        run: cmake --preset ${{ matrix.preset-prefix }}-${{ matrix.config }} -DCMAKE_BUILD_TYPE=${{ matrix.config }} 

      - name: Build Library
        run: cmake --build --preset ${{ matrix.preset-prefix }}-${{ matrix.config }} --config ${{ matrix.config }}

      - name: Run GTests
        run: ./run_tests
        working-directory: ./build/${{ matrix.preset-prefix }}-${{ matrix.config }}

      - name: Upload Artifacts
        if: matrix.config == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: CALUMI-Animation-${{ github.run_number }}-${{matrix.preset-prefix}}-${{matrix.arch}}
          path: |
            ./build/${{ matrix.preset-prefix }}-${{ matrix.config }}/CALUMI.Animation.dll
            ./build/${{ matrix.preset-prefix }}-${{ matrix.config }}/CALUMI.Animation.lib
            ./build/${{ matrix.preset-prefix }}-${{ matrix.config }}/libCALUMI.Animation.so*
            ./build/${{ matrix.preset-prefix }}-${{ matrix.config }}/libCALUMI.Animation*.dylib
            ./include/Anim*
            ./include/*.h